<mat-card>
  <mat-card-title>Pedidos</mat-card-title>
  <mat-card-content>
    <table mat-table [dataSource]="pedidos" class="mat-elevation-z8" style="width: 100%;">

      <ng-container matColumnDef="numero">
        <th mat-header-cell *matHeaderCellDef> Nº Pedido </th>
        <td mat-cell *matCellDef="let pedido"> {{pedido.numero}} </td>
      </ng-container>

      <ng-container matColumnDef="cliente">
        <th mat-header-cell *matHeaderCellDef> Cliente </th>
        <td mat-cell *matCellDef="let pedido"> {{pedido.cliente?.nome}} </td>
      </ng-container>

      <ng-container matColumnDef="data">
        <th mat-header-cell *matHeaderCellDef> Data </th>
        <td mat-cell *matCellDef="let pedido"> {{pedido.data | date:'short'}} </td>
      </ng-container>

      <ng-container matColumnDef="total">
        <th mat-header-cell *matHeaderCellDef> Total </th>
        <td mat-cell *matCellDef="let pedido"> R$ {{pedido.total | number:'1.2-2'}} </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef> Status </th>
        <td mat-cell *matCellDef="let pedido"> {{pedido.status}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>
  </mat-card-content>
</mat-card>
