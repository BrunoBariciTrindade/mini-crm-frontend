
<div style="display: flex; flex-direction: column; align-items: center; margin-top: 100px;" border="1px solid black">
<mat-card style="width: 300px; text-align: center; background-color: #0306a1; color: rgb(161, 158, 158);">
    <mat-card-title style="padding: 18px 5px;  text-align: center; width: 100%; font-size: 28px;">
  LOGIN
</mat-card-title>
    <mat-card-content>
      <form #loginForm="ngForm" (ngSubmit)="login()">
        <mat-form-field style="width: 100%;">
          <mat-label>Usuário</mat-label>
          <input matInput [(ngModel)]="username" name="username" required>
        </mat-form-field>

        <mat-form-field style="width: 100%;">
          <mat-label>Senha</mat-label>
          <input matInput [(ngModel)]="password" name="password" type="password" required>
        </mat-form-field>
        <button mat-raised-button color="primary" style="width: 100%; margin-top: 10px;"(click)="cadastrar()"> Cadastrar </button>
        <button mat-raised-button color="primary" style="width: 100%; margin-top: 10px;">Entrar</button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
