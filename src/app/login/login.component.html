<section class="h-100 custom-bg d-flex align-items-center justify-content-center">
  <div class="container py-5 h-100">
    <div class="row justify-content-center align-items-center h-100">
      <div class="col-xl-10">
        <div class="card rounded-3 text-black">
          <div class="row g-0">
            <!-- Coluna do formulário -->
            <div class="col-lg-6">
              <div class="card-body p-md-5 mx-md-4">
                <div class="text-center mb-4">
                  <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-login-form/lotus.webp"
                       style="width: 100px;" alt="logo">
                  <h4 class="mt-3">We are The Lotus Team</h4>
                </div>

                <form>
  <p class="text-center">Por favor, logue em sua conta</p>

  <div class="form-outline mb-4">
    <label class="form-label" for="form2Example11">Cpf</label>
    <input
      type="text"
      id="form2Example11"
      class="form-control"
      placeholder="Escolha um username"
      [(ngModel)]="cpf"
      name="username"
    />
  </div>

  <div class="form-outline mb-4">
    <label class="form-label" for="form2Example22">senha</label>
    <input
      type="password"
      id="form2Example22"
      class="form-control"
      [(ngModel)]="senha"
      name="password"
    />
  </div>

  <div class="text-center pt-1 mb-5">
    <button
      class="btn btn-primary btn-block fa-lg gradient-custom-2 mb-3"
      type="button"
      (click)="login()"
    >
      Logar
    </button>
    <a class="text-muted" href="#!">Esqueceu sua senha?</a>
  </div>

  <div class="d-flex align-items-center justify-content-center pb-4">
    <p class="mb-0 me-2">Não tem uma conta?</p>
    <button type="button" class="btn btn-outline-danger" (click)="cadastrar()">Cadastrar</button>
  </div>
</form>

              </div>
            </div>

            <!-- Coluna da imagem decorativa -->
            <div class="col-lg-6 d-flex align-items-center custom-right-col">
              <div class="text-white px-3 py-4 p-md-5 mx-md-4">
                <h4 class="mb-4">We are more than just a company</h4>
                <p class="small mb-0">Lorem ipsum dolor sit amet, consectetur adipisicing elit, sed do eiusmod
                  tempor incididunt ut labore et dolore magna aliqua...</p>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</section>
