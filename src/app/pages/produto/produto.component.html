<div class="album py-5 bg-light">
  <div class="container">
    <h2 class="mb-4 text-center">Catálogo de Produtos</h2>

    <div class="row">
      <div class="col-md-4" *ngFor="let produto of produtos">
        <div class="card mb-4 shadow-sm">
          <img class="card-img-top"
               [src]="getImagem(produto.imagem)"
               [alt]="produto.nome">
          <div class="card-body">
            <h5 class="card-title">{{ produto.nome }}</h5>
            <p class="card-text">{{ produto.descricao }}</p>
            <p class="text-muted">Preço: {{ produto.price | currency:'BRL' }}</p>
            <div class="d-flex justify-content-between align-items-center">
              <button type="button" class="btn btn-sm btn-outline-secondary" (click)="adicionarAoCarrinho(produto)">
                Adicionar ao carrinho
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<router-outlet></router-outlet>
