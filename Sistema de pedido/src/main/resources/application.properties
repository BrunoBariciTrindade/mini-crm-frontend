# ===============================
# CONFIGURAÇÃO DO SERVIDOR
# ===============================
server.port=8080

# ===============================
# CONFIGURAÇÃO DO BANCO DE DADOS (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/sistema-pedido?useSSL=false&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=root

# Driver JDBC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
# Dialeto do MySQL (ajuda o Hibernate a gerar SQL compatível)
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Atualiza ou cria o esquema automaticamente
# Opções: none, validate, update, create, create-drop
spring.jpa.hibernate.ddl-auto=update

# Mostra as queries SQL no console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# LOGGING
# ===============================
# Nível de log para SQL e Hibernate
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

